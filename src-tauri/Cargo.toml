[package]
name = "wcraft-launcher"
version = "0.4.6"
edition = "2021"

[lib]
name = "wcraft_launcher"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
flate2 = "1"
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"], default-features = false }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
dirs = "6"
md5 = "0.7"
flate2 = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[target.'cfg(not(windows))'.dependencies]
tar = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# build.rs gzips the embedded CLI (~80 MB); unoptimized deflate takes minutes.
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.flate2]
opt-level = 3

# Debug info triples the size of target/ and nothing here reads it.
[profile.dev]
debug = 0
