<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1836"/>
      <stop offset="1" stop-color="#0b0a14"/>
    </linearGradient>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a6ff"/>
      <stop offset="1" stop-color="#6b4bff"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="8"/>
  <!-- A blocky W: five columns of squares on a 96px grid -->
  <g fill="url(#w)">
    <rect x="224" y="304" width="96" height="320"/>
    <rect x="320" y="624" width="96" height="96"/>
    <rect x="416" y="432" width="96" height="192"/>
    <rect x="512" y="432" width="96" height="192"/>
    <rect x="608" y="624" width="96" height="96"/>
    <rect x="704" y="304" width="96" height="320"/>
  </g>
</svg>
